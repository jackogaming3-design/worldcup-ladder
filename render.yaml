# Render Blueprint — deploys the web service + a managed Postgres database.
# In the Render dashboard: New → Blueprint → connect this repo → Apply.
# Then set the two secret values (API_FOOTBALL_KEY, ADMIN_PASSWORD) when prompted.
#
# Scheduled syncing is handled for FREE by .github/workflows/sync.yml (GitHub
# Actions). If you'd rather use a Render Cron Job (paid), see the README.

databases:
  - name: worldcup-ladder-db
    databaseName: worldcup_ladder
    plan: free # NOTE: Render's free Postgres expires after ~30 days. See README to upgrade or use Supabase.

services:
  - type: web
    name: worldcup-ladder
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worldcup-ladder-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: API_FOOTBALL_BASE_URL
        value: https://v3.football.api-sports.io
      - key: API_FOOTBALL_KEY_HEADER
        value: x-apisports-key
      - key: WORLD_CUP_LEAGUE_ID
        value: "1"
      - key: WORLD_CUP_SEASON
        value: "2026"
      # Secrets — set these in the dashboard (not stored in the repo):
      - key: API_FOOTBALL_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Auto-generated strong secrets:
      - key: CRON_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
