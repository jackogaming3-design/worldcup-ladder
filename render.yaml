# Render Blueprint — deploys the web service + a managed Postgres database.
# In the Render dashboard: New → Blueprint → connect this repo → Apply.
# Then set ONE secret value (ADMIN_PASSWORD) when prompted — that's it.
#
# Results come from ESPN's free public World Cup feed, so there is NO data API
# key to configure. Scheduled syncing is handled for free by
# .github/workflows/sync.yml (GitHub Actions); see the README for a paid Render
# Cron alternative.

databases:
  - name: worldcup-ladder-db
    databaseName: worldcup_ladder
    plan: free # NOTE: Render's free Postgres expires after ~30 days. See README to upgrade or use Supabase.

services:
  - type: web
    name: worldcup-ladder
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worldcup-ladder-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: WORLD_CUP_SEASON
        value: "2026"
      # Secret — set this in the dashboard (not stored in the repo):
      - key: ADMIN_PASSWORD
        sync: false
      # Auto-generated strong secrets:
      - key: CRON_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
